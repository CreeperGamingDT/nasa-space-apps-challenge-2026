<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonora - NASA Space Apps Challenge 2026</title>
    <meta name="description" content="Sonora is a sonified view of global surface temperature data. Explore a live temperature map, search for a location, and listen to the conditions with the scanner. Built for the NASA Space Apps Challenge 2026.">
    <meta name="application-name" content="Sonora">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0e141c">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">


    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- DEBUG -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/eruda"></script> -->
    <!-- <script>eruda.init();</script> -->
    <!-- END DEBUG -->

    <header class="masthead">
        <div class="brand">
            <img class="brand-icon" src="/favicon.ico" alt="" width="32" height="32">
            <h1 class="brand-title">SONORA</h1>
        </div>
        <p class="brand-meta">NASA Space Apps Challenge 2026</p>
    </header>

    <section class="toolbar" aria-label="Viewer controls">
        <div class="toolbar-cell search-cell">
            <label class="cell-label" for="search">Location:</label>
            <input type="text" id="search" placeholder="Search for a location…" autocomplete="off" spellcheck="false">
            <div id="search-dropdown" role="listbox" aria-label="Search results" hidden></div>
        </div>

        <div class="toolbar-cell" title="Timestamp of the loaded data">
            <span class="cell-label">Date:</span>
            <span class="cell-value mono" id="time-readout">—</span>
        </div>

        <button id="scanner-toggle" type="button" class="toolbar-button" disabled>Play scanner</button>

        <div class="legend-scale">
            <span class="cell-label">Temperature</span>
            <span class="legend-bound mono">-35 °C</span>
            <div id="legend-gradient" class="legend-gradient" aria-hidden="true"></div>
            <span class="legend-bound mono">+35 °C</span>
        </div>
    </section>

    <main class="viewer">
        <div class="map" id="map">
            <canvas id="map-canvas"></canvas>
            <canvas id="scanner-overlay" class="scanner-overlay"></canvas>
        </div>
    </main>

    <script type="module" src="index.ts"></script>
</body>

</html>
